apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wordpress
  name: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      volumes:
      - name: wordpress-storage
        persistentVolumeClaim:
          claimName: wordpress-pvc-jegan  #Replace 'jegan' with your name

      containers:
      - name: wordpress
        image: wordpress:php8.2

        imagePullPolicy: IfNotPresent

        volumeMounts:
        - name: wordpress-storage
          mountPath: /var/www/html/

        env:
        - name: WORDPRESS_DB_USER
          valueFrom: 
            secretKeyRef:
              name: wordpress-login-credentials
              key: username 

        - name: WORDPRESS_DB_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: wordpress-login-credentials
              key: password 

        - name: WORDPRESS_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: wordpress-cm
              key: db_name

        - name: WORDPRESS_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: wordpress-cm
              key: db_service_name
