apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-pvc-jegan  # Replace 'jegan' with your name
spec:
  storageClassName: nfs-storage
  selector:
    matchLabels:
      name: jegan  # Replace 'jegan' with your name
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 100Mi
