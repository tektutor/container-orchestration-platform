apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tektutor
  annotations:
    haproxy.router.openshift.io/rewrite-target: /
spec:
  rules:
    - host: tektutor
      http:
        paths:
        - backend:
            service:
              name: nginx
              port:
                number: 80
          path: /nginx
          pathType: Prefix

        - backend:
            service:
              name: hello 
              port:
                number: 80
          path: /hello
          pathType: Prefix
